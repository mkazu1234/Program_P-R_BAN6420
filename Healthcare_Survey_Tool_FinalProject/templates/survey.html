<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>
    <h1>User Survey</h1>
    <form action="/submit" method="POST">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required><br>
        
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select><br>

        <label for="total_income">Total Income:</label>
        <input type="number" id="total_income" name="total_income" step="0.01" required><br>

        <h3>Expenses</h3>

        <label for="utilities">Utilities:</label>
        <input type="checkbox" id="include_utilities" name="include_utilities" value="1">
        <input type="number" id="utilities" name="utilities" step="0.01" placeholder="Amount"><br><br>

        <label for="entertainment">Entertainment:</label>
        <input type="checkbox" id="include_entertainment" name="include_entertainment" value="1">
        <input type="number" id="entertainment" name="entertainment" step="0.01" placeholder="Amount"><br><br>

        <label for="school_fees">School Fees:</label>
        <input type="checkbox" id="include_school_fees" name="include_school_fees" value="1">
        <input type="number" id="school_fees" name="school_fees" step="0.01" placeholder="Amount"><br><br>

        <label for="shopping">Shopping:</label>
        <input type="checkbox" id="include_shopping" name="include_shopping" value="1">
        <input type="number" id="shopping" name="shopping" step="0.01" placeholder="Amount"><br><br>

        <label for="healthcare">Healthcare:</label>
        <input type="checkbox" id="include_healthcare" name="include_healthcare" value="1">
        <input type="number" id="healthcare" name="healthcare" step="0.01" placeholder="Amount"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
